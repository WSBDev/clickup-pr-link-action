name: ClickUp PR Link (self-test)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

# one run at a time per pull request, in event order: without this a slow "opened" run could
# finish after the "closed" run and put a merged task back in review
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-clickup-link:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # run the action from this checkout, so a pull request here exercises its own changes
      - name: Add ClickUp task link to PR
        uses: ./
        with:
          clickup_api_key: ${{ secrets.CLICKUP_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
