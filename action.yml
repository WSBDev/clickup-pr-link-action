name: 'ClickUp PR Link'
description: 'Add the ClickUp task link to a PR description and keep the task status in step with the PR'
author: 'Lex Dyer'

branding:
  icon: 'link'
  color: 'purple'

inputs:
  clickup_api_key:
    description: 'ClickUp API key for reading the task and setting its status'
    required: true
  github_token:
    description: 'GitHub token for reading the PR state and updating the PR description'
    required: true
    default: ${{ github.token }}
  branch_name:
    description: 'Branch name to look for a ClickUp ID in'
    required: false
    default: ${{ github.head_ref }}
  review_status:
    description: 'Task status to set when a PR is opened, reopened or marked ready for review. Empty string turns this off.'
    required: false
    default: 'in review'
  merged_status:
    description: 'Task status to set when a PR is merged. Empty string turns this off.'
    required: false
    default: 'complete'

outputs:
  clickup_id:
    description: 'ClickUp task ID the PR was matched to; empty when there is none'
    value: ${{ steps.sync.outputs.clickup_id }}
  task_url:
    description: 'Full URL to the ClickUp task'
    value: ${{ steps.sync.outputs.task_url }}

runs:
  using: 'composite'
  steps:
    # neither step may fail the job: keeping a ticket in step is bookkeeping, and this check is a
    # required one in some repositories. every problem is raised as a "::warning::" annotation.

    # find the clickup task for this pr from its title and branch name, publish it for the link
    # step below, and bring its status in line with the pr. every value reaches the script through
    # env, never through the script text, so a branch name, pr title or task title cannot be read
    # as shell code.
    - name: Sync ClickUp task
      id: sync
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        EVENT_ACTION: ${{ github.event.action }}
        CLICKUP_API_KEY: ${{ inputs.clickup_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_STATUS: ${{ inputs.review_status }}
        MERGED_STATUS: ${{ inputs.merged_status }}
        # github gives no secrets to runs for a pr from another repository or triggered by
        # dependabot; there an empty api key is expected and is not worth a warning.
        # head.repo.fork is not used: it is also true for same-repo prs in a repo that is a fork.
        SECRETS_WITHHELD: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"

    # add the task link to the pr description, whenever the step above found the task.
    - name: Update PR description
      if: ${{ !cancelled() && steps.sync.outputs.task_title != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ github.repository }}
        CLICKUP_ID: ${{ steps.sync.outputs.clickup_id }}
        TASK_URL: ${{ steps.sync.outputs.task_url }}
        TASK_TITLE: ${{ steps.sync.outputs.task_title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # get current pr description
        if ! CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body'); then
          echo "::warning::Could not add the ClickUp link: the pull request description could not be read"
          exit 0
        fi

        # check for a link to this task, with or without the workspace number in its path.
        # the bare id is not enough: a description ending in "CU-<id>" is not a link.
        # the body is fed in as a here-string, not piped from echo: under pipefail, grep -q
        # leaving at the first match can kill echo on a long body and make a match read as none.
        if grep -qE "app\.clickup\.com/t/([0-9]+/)?$CLICKUP_ID" <<<"$CURRENT_BODY"; then
          echo "ClickUp link already exists in PR description"
          exit 0
        fi

        # create clickup section to prepend, in a file of this job's own
        BODY_FILE=$(mktemp)
        {
          printf "## ClickUp Task\n\n"
          printf "**[%s](%s)**\n\n" "$TASK_TITLE" "$TASK_URL"
          printf -- "---\n\n"
          printf "%s" "$CURRENT_BODY"
        } > "$BODY_FILE"

        # update pr description from file
        if ! gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"; then
          echo "::warning::Could not add the ClickUp link: the pull request description could not be edited"
          exit 0
        fi

        echo "Updated PR #$PR_NUMBER with ClickUp task link"
