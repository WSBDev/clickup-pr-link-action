name: 'ClickUp PR Link'
description: 'Add the ClickUp task link to a PR description and keep the task status in step with the PR'
author: 'Lex Dyer'

branding:
  icon: 'link'
  color: 'purple'

inputs:
  clickup_api_key:
    description: 'ClickUp API key for reading task details and setting the task status'
    required: true
  github_token:
    description: 'GitHub token for updating PR description'
    required: true
    default: ${{ github.token }}
  branch_name:
    description: 'Branch name to extract ClickUp ID from'
    required: false
    default: ${{ github.head_ref }}
  review_status:
    description: 'Task status to set when a PR is opened, reopened or marked ready for review. Empty string turns this off.'
    required: false
    default: 'in review'
  merged_status:
    description: 'Task status to set when a PR is merged. Empty string turns this off.'
    required: false
    default: 'complete'

outputs:
  clickup_id:
    description: 'Extracted ClickUp task ID'
    value: ${{ steps.extract.outputs.clickup_id }}
  task_url:
    description: 'Full URL to the ClickUp task'
    value: ${{ steps.extract.outputs.task_url }}

runs:
  using: 'composite'
  steps:
    # find the clickup task id in the pr title, then the branch name, then the pr description.
    # values reach the script through env, never through the script text, so a branch name or
    # title cannot be read as shell code.
    - name: Extract ClickUp ID
      id: extract
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs" extract

    # fetch task details from clickup api
    - name: Fetch ClickUp task details
      id: fetch
      if: steps.extract.outputs.clickup_id != ''
      shell: bash
      env:
        CLICKUP_ID: ${{ steps.extract.outputs.clickup_id }}
        CLICKUP_API_KEY: ${{ inputs.clickup_api_key }}
      run: |
        # call clickup api to get task details
        RESPONSE=$(curl -s -X GET \
          "https://api.clickup.com/api/v2/task/$CLICKUP_ID" \
          -H "Authorization: $CLICKUP_API_KEY" \
          -H "Content-Type: application/json")

        # check if request was successful
        if echo "$RESPONSE" | grep -q '"err"'; then
          echo "⚠️ Failed to fetch task details from ClickUp"
          echo "$RESPONSE"
          echo "task_title=" >> $GITHUB_OUTPUT
          exit 0
        fi

        # extract task title using jq or python
        if command -v jq &> /dev/null; then
          TASK_TITLE=$(echo "$RESPONSE" | jq -r '.name // empty')
          TASK_STATUS=$(echo "$RESPONSE" | jq -r '.status.status // empty')
        else
          # fallback to python if jq not available
          TASK_TITLE=$(echo "$RESPONSE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('name', ''))")
          TASK_STATUS=$(echo "$RESPONSE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('status', {}).get('status', ''))")
        fi

        if [ -z "$TASK_TITLE" ]; then
          echo "⚠️ Could not extract task title from response"
          echo "task_title=" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "✓ Task: $TASK_TITLE"
        echo "task_title=$TASK_TITLE" >> $GITHUB_OUTPUT
        echo "task_status=$TASK_STATUS" >> $GITHUB_OUTPUT

    # update pr description with clickup link
    - name: Update PR description
      if: steps.extract.outputs.clickup_id != '' && steps.fetch.outputs.task_title != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CLICKUP_ID: ${{ steps.extract.outputs.clickup_id }}
        TASK_URL: ${{ steps.extract.outputs.task_url }}
        TASK_TITLE: ${{ steps.fetch.outputs.task_title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # get current pr description
        CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

        # check if clickup link already exists in description
        if echo "$CURRENT_BODY" | grep -q "$CLICKUP_ID"; then
          echo "ℹ️ ClickUp link already exists in PR description"
          exit 0
        fi

        # create clickup section to prepend
        {
          printf "## 🎯 ClickUp Task\n\n"
          printf "**[%s](%s)**\n\n" "$TASK_TITLE" "$TASK_URL"
          printf -- "---\n\n"
          printf "%s" "$CURRENT_BODY"
        } > /tmp/pr_body.md

        # update pr description from file
        gh pr edit "$PR_NUMBER" --body-file /tmp/pr_body.md

        echo "✓ Updated PR #$PR_NUMBER with ClickUp task link"

    # move the clickup task to match the pr: review status when it opens, merged status when it
    # merges. runs last so a refused status change never stops the link from being added, and
    # "!cancelled()" lets it run even when a link step failed: a merge fires only once, so a
    # skipped run would leave the task behind for good. it fails the job when a due change cannot
    # be made, so a dead api key shows as a red check.
    - name: Sync ClickUp task status
      if: ${{ !cancelled() && steps.extract.outputs.clickup_id != '' }}
      shell: bash
      env:
        CLICKUP_API_KEY: ${{ inputs.clickup_api_key }}
        CLICKUP_ID: ${{ steps.extract.outputs.clickup_id }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        REVIEW_STATUS: ${{ inputs.review_status }}
        MERGED_STATUS: ${{ inputs.merged_status }}
        # github gives no secrets to runs for a pr from another repository or triggered by
        # dependabot; there an empty api key is expected and must not turn the check red.
        # head.repo.fork is not used: it is also true for same-repo prs in a repo that is a fork.
        SECRETS_WITHHELD: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs" sync-status
